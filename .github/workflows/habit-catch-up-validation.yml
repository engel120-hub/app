name: Habit catch-up validation
on:
  push:
    branches: [codex/habit-catch-up-validation-663]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-light, desktop-dark, mobile-light, mobile-dark]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50575acc860a83a2fa67f3a9ab405c2be562240a
      - run: npm ci
      - name: Generate real Linux Chromium habit baselines
        run: |
          cat > playwright.habit-bootstrap.config.ts <<'EOF'
          import base from './playwright.config';
          export default { ...base, webServer: [
            { command: 'node e2e/mock-api.mjs', url: 'http://127.0.0.1:3001/healthz', timeout: 60000 },
            { command: 'npx next build && npm run start:standalone', url: 'http://localhost:3000/healthz', timeout: 360000,
              env: { ...process.env, HOSTNAME: '0.0.0.0', NEXT_PUBLIC_API_URL: 'http://127.0.0.1:3001', NEXT_PUBLIC_APP_VERSION: 'dev', NEXT_PUBLIC_E2E_NOW: '2026-01-07T12:00:00.000Z' } }
          ] };
          EOF
          npx playwright test e2e/visual.spec.ts --grep "habit-tracker" --update-snapshots --config=playwright.habit-bootstrap.config.ts --project=${{ matrix.project }} --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: habit-catch-up-${{ matrix.project }}
          path: |
            e2e/visual.spec.ts-snapshots/*habit-tracker*${{ matrix.project }}-linux.png
            test-results/
  a38:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50575acc860a83a2fa67f3a9ab405c2be562240a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned A38 tooling
        run: pip install git+https://github.com/DFXswiss/agent.git@e63980625f5b778c5a93104b0bf5de7fb5e379a8
      - name: Measure A38 policy on exact PR head
        run: agent a38 run --repo . --repository 21gifts/app --policy .github/a38.json --base-sha b96d62bcb20790108adbc91b47e0c6c9828cf980 --output ${{ runner.temp }}/habit-a38/report.md --logs-dir ${{ runner.temp }}/habit-a38/logs --public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: habit-a38-report
          path: ${{ runner.temp }}/habit-a38/
