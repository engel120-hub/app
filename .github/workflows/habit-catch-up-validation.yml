name: Habit catch-up validation
on:
  push:
    branches: [codex/habit-catch-up-validation-663]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a38:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5163071a8a6f25c525c4f6625d1331852d64bdf4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned A38 tooling
        run: pip install git+https://github.com/DFXswiss/agent.git@e63980625f5b778c5a93104b0bf5de7fb5e379a8
      - name: Measure A38 policy on exact PR head
        run: |
          agent a38 run --repo . --repository 21gifts/app --policy .github/a38.json --base-sha b96d62bcb20790108adbc91b47e0c6c9828cf980 --output ${{ runner.temp }}/habit-a38/report.md --logs-dir ${{ runner.temp }}/habit-a38/logs --public
          agent a38 verify --policy .github/a38.json --file ${{ runner.temp }}/habit-a38/report.md --repo 21gifts/app --head 5163071a8a6f25c525c4f6625d1331852d64bdf4 --public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: habit-a38-report
          path: ${{ runner.temp }}/habit-a38/
